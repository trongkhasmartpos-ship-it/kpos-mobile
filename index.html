<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316"><meta name="apple-mobile-web-app-capable" content="yes"><title>KPOS Mobile</title><style>:root{--o:#f97316;--od:#ea580c;--os:#fff7ed;--bg:#fffaf7;--t:#111827;--m:#6b7280;--line:#fed7aa;--g:#059669;--r:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t)}button,input,select,textarea{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:78px}.top{position:sticky;top:0;z-index:20;background:#fffaf7ee;backdrop-filter:blur(12px);padding:14px 14px 10px;border-bottom:1px solid #ffedd5;display:flex;justify-content:space-between;align-items:center}.title{font-weight:900;font-size:20px}.sub{font-size:12px;color:var(--m)}.kp{width:38px;height:38px;border-radius:12px;background:var(--o);color:white;display:grid;place-items:center;font-weight:900}.content{padding:14px}.card{background:#fff;border:1px solid #ffedd5;border-radius:18px;padding:14px;box-shadow:0 8px 24px #0f172a10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:20px;margin-top:5px}.stat span{font-size:12px;color:var(--m)}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:800}.btn.o{background:var(--o);color:white}.btn.ghost{background:#fff;border:1px solid #fdba74}.btn.green{background:var(--g);color:#fff}.btn.red{background:var(--r);color:#fff}.block{width:100%}.small{font-size:12px;padding:8px 10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#fff;border-top:1px solid #fed7aa;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}.nav button{border:0;background:transparent;color:#6b7280;font-size:11px;font-weight:700}.nav button span{display:block;font-size:20px}.nav button.active{color:var(--o)}.search{display:flex;gap:8px;margin-bottom:12px}.search input,.field input,.field select,.field textarea{width:100%;border:1px solid #e5e7eb;border-radius:13px;padding:12px;background:#fff;outline:none}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--m);margin-bottom:6px}.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border:1px solid #ffedd5;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}.thumb{width:58px;height:58px;border-radius:13px;background:#f3f4f6;display:grid;place-items:center;font-size:24px}.main{flex:1;min-width:0}.name{font-weight:900}.muted{font-size:12px;color:var(--m);margin-top:3px}.price{font-weight:900;margin-top:5px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--os);color:#c2410c;font-size:11px;font-weight:900;margin-top:6px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.section{font-weight:900;margin:18px 2px 9px}.sheetbg{position:fixed;inset:0;background:#11182766;z-index:50;display:flex;align-items:flex-end}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:16px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:#f3f4f6;border-radius:10px;width:34px;height:34px}.qty{display:flex;gap:6px;align-items:center}.qty button{border:0;width:30px;height:30px;border-radius:9px;background:#fff7ed;color:#c2410c;font-weight:900}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;font-weight:800;background:#eff6ff;color:#1d4ed8;padding:5px 7px;border-radius:8px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid #fed7aa;background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.tabs button.on{background:var(--o);color:#fff}.timeline{border-left:2px solid #fed7aa;padding-left:14px}.tl{margin-bottom:12px}.printbox{background:#f8fafc;border:1px solid #e5e7eb;border-radius:15px;padding:10px;overflow:auto}.k80{width:300px;max-width:100%;margin:auto;background:#fff;border:1px dashed #aaa;padding:14px}.a4{width:720px;max-width:100%;margin:auto;background:#fff;border:1px solid #ccc;padding:20px}.printlogo{color:var(--o);font-weight:900;font-size:20px}.dash{border-top:1px dashed #999;margin:9px 0}.ptable{width:100%;border-collapse:collapse;font-size:12px}.ptable th,.ptable td{padding:6px;border-bottom:1px dashed #ddd;text-align:left}.ptable td:last-child,.ptable th:last-child{text-align:right}.a4 .ptable th,.a4 .ptable td{border:1px solid #ddd}.scanfeed{display:flex;flex-direction:column;gap:7px}.scanrow{border:1px solid #ffedd5;border-radius:12px;padding:10px;display:flex;justify-content:space-between}.ok{color:var(--g);font-weight:900}.warn{color:var(--r);font-weight:900}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#fff7ed,#fed7aa)}.loginbox{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:22px;box-shadow:0 24px 60px #0002}.hero{font-size:26px;font-weight:900}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:13px;padding:11px;font-size:12px;color:#9a3412}.crmcard{background:#fff;border:1px solid #ffedd5;border-radius:15px;padding:12px}.crmstatus{font-size:11px;font-weight:900;color:#c2410c;background:#fff7ed;padding:5px 8px;border-radius:999px}.total{font-size:20px;font-weight:900;color:var(--o)}@media(max-width:360px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div id="root"></div><script>const K='kpos_full_v1',S='kpos_session';const seed={products:[{id:1,name:'Máy POS SUNMI D2',sku:'SUNMID2',barcode:'893100000001',price:5800000,cost:5000000,stock:3,imei:true,warranty:12},{id:2,name:'Máy in HPRT TP80N-M',sku:'TP80NM',barcode:'893100000002',price:850000,cost:720000,stock:8,imei:false,warranty:12},{id:3,name:'Giấy in K80x45',sku:'K8045',barcode:'893100000003',price:9000,cost:6000,stock:60,imei:false,warranty:0}],imeis:[{id:101,productId:1,value:'SUNMID2-0001',status:'Trong kho'},{id:102,productId:1,value:'SUNMID2-0002',status:'Trong kho'},{id:103,productId:1,value:'SUNMID2-0003',status:'Trong kho'}],customers:[{id:1,name:'Nguyễn Văn A',phone:'0900000001',status:'Đã mua hàng',need:'',nextCare:'',history:[],total:0,debt:0},{id:2,name:'Trần Minh B',phone:'0900000002',status:'Đang tư vấn',need:'Máy in bill',nextCare:'',history:[],total:0,debt:0}],invoices:[],warranties:[],payments:[],cart:[]};let db=JSON.parse(localStorage.getItem(K)||'null')||structuredClone(seed);let st={screen:'home',modal:null,customer:null,crmTab:'all',printType:'sale'};const $=s=>document.querySelector(s),money=n=>(+n||0).toLocaleString('vi-VN')+'đ',save=()=>localStorage.setItem(K,JSON.stringify(db)),prod=id=>db.products.find(x=>x.id===id),cust=id=>db.customers.find(x=>x.id===id),imei=id=>db.imeis.find(x=>x.id===id);function code(p,a){let d=new Date(),x=('0'+d.getDate()).slice(-2)+('0'+(d.getMonth()+1)).slice(-2)+String(d.getFullYear()).slice(-2);return p+x+'-'+String(a.length+1).padStart(3,'0')}function top(t,s=''){return `<div class="top"><div><div class="title">${t}</div><div class="sub">${s}</div></div><div class="kp">KP</div></div>`}function nav(){let a=[['home','🏠','Tổng quan'],['pos','🛒','Bán hàng'],['crm','👥','CRM'],['warranty','🛡️','Bảo hành'],['more','☰','Thêm']];return `<div class="nav">${a.map(x=>`<button class="${st.screen==x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`}window.go=s=>{st.screen=s;st.modal=null;render()};function layout(body){return `<div class="app">${body}${nav()}</div>`}function stat(l,v){return `<div class="card stat"><span>${l}</span><b>${v}</b></div>`}function home(){let rev=db.invoices.reduce((a,b)=>a+b.total,0),debt=db.customers.reduce((a,b)=>a+b.debt,0);return layout(`${top('Tổng quan','KPOS • Bán hàng • CRM • IMEI • Bảo hành')}<div class="content"><div class="grid">${stat('Doanh thu',money(rev))}${stat('Đơn hàng',db.invoices.length)}${stat('Công nợ',money(debt))}${stat('IMEI trong kho',db.imeis.filter(x=>x.status==='Trong kho').length)}</div><div class="section">Thao tác nhanh</div><div class="grid"><button class="btn o" onclick="go('pos')">🛒 Bán hàng</button><button class="btn o" onclick="go('crm')">👥 CRM</button><button class="btn ghost" onclick="openStock()">📥 Nhập hàng</button><button class="btn ghost" onclick="go('more')">🖨 Mẫu in</button></div></div>`)}function productCards(list){return list.map(p=>`<div class="item"><div class="thumb">📦</div><div class="main"><div class="name">${p.name}</div><div class="muted">${p.sku} • Tồn ${p.stock}</div>${p.imei?`<div class="badge">▥ Có IMEI/Serial • ${db.imeis.filter(i=>i.productId===p.id&&i.status==='Trong kho').length}</div>`:''}<div class="price">${money(p.price)}</div></div><button class="btn o small" onclick="addCart(${p.id})">＋</button></div>`).join('')}function pos(){let total=db.cart.reduce((a,c)=>a+prod(c.productId).price*c.qty,0);return layout(`${top('Bán hàng','Quét mã • IMEI/Serial • thanh toán')}<div class="content"><div class="search"><input id="pq" placeholder="Tìm tên, SKU, barcode..." oninput="filterPos()"><button class="btn o" onclick="scanProduct()">📷</button></div><div class="card row" style="margin-bottom:12px"><div><div class="sub">Khách hàng</div><b>${st.customer?st.customer.name:'Khách lẻ'}</b></div><button class="btn ghost small" onclick="pickCustomer()">Chọn khách</button></div><div id="plist" class="list">${productCards(db.products)}</div>${db.cart.length?`<div class="section">Giỏ hàng</div><div class="list">${cartCards()}</div><div class="card row" style="position:sticky;bottom:78px;margin-top:12px"><div><div class="sub">${db.cart.reduce((a,b)=>a+b.qty,0)} sản phẩm</div><div class="total">${money(total)}</div></div><button class="btn green" onclick="checkout()">THANH TOÁN</button></div>`:''}</div>`)}window.filterPos=()=>{let q=$('#pq').value.toLowerCase();$('#plist').innerHTML=productCards(db.products.filter(p=>[p.name,p.sku,p.barcode].some(v=>String(v).toLowerCase().includes(q))))};window.addCart=id=>{let p=prod(id),c=db.cart.find(x=>x.productId===id);if(p.stock<1)return alert('Hết hàng');if(c){if(c.qty>=p.stock)return;c.qty++}else db.cart.push({productId:id,qty:1,imeis:[]});save();render();if(p.imei)setTimeout(()=>selectImei(id),50)};function cartCards(){return db.cart.map(c=>{let p=prod(c.productId);return `<div class="item"><div class="main"><div class="name">${p.name}</div><div class="price">${money(p.price*c.qty)}</div>${p.imei?`<button class="btn ghost small" onclick="selectImei(${p.id})">▥ IMEI/Serial ${c.imeis.length}/${c.qty}</button>`:''}<div class="muted">Bảo hành: ${p.warranty} tháng</div><div class="tags">${c.imeis.map(i=>`<span class="tag">${imei(i)?.value||''}</span>`).join('')}</div></div><div class="qty"><button onclick="qty(${p.id},-1)">−</button><b>${c.qty}</b><button onclick="qty(${p.id},1)">＋</button></div></div>`}).join('')}window.qty=(id,d)=>{let c=db.cart.find(x=>x.productId===id),p=prod(id);c.qty+=d;if(c.qty<=0)db.cart=db.cart.filter(x=>x.productId!==id);else if(c.qty>p.stock)c.qty=p.stock;if(c.imeis.length>c.qty)c.imeis=c.imeis.slice(0,c.qty);save();render()};function selectImei(id){let c=db.cart.find(x=>x.productId===id),list=db.imeis.filter(i=>i.productId===id&&i.status==='Trong kho');st.modal={type:'imei',id,selected:[...c.imeis],list};render()}window.toggleImei=id=>{let m=st.modal,c=db.cart.find(x=>x.productId===m.id),k=m.selected.indexOf(id);if(k>=0)m.selected.splice(k,1);else if(m.selected.length<c.qty)m.selected.push(id);render()};window.saveImei=()=>{let m=st.modal,c=db.cart.find(x=>x.productId===m.id);if(m.selected.length!==c.qty)return alert('Chọn đủ IMEI/Serial');c.imeis=[...m.selected];save();st.modal=null;render()};function pickCustomer(){st.modal={type:'customers'};render()}window.chooseCustomer=id=>{st.customer=cust(id);st.modal=null;render()};function checkout(){for(let c of db.cart){let p=prod(c.productId);if(p.imei&&c.imeis.length!==c.qty)return alert('Chọn đủ IMEI cho '+p.name)}st.modal={type:'checkout'};render()}window.finishCheckout=()=>{let base=db.cart.reduce((a,c)=>a+prod(c.productId).price*c.qty,0),discount=+$('#discount').value||0,surcharge=+$('#surcharge').value||0,total=Math.max(0,base-discount+surcharge),method=$('#method').value,paid=method==='Ghi nợ / Công nợ'?0:Math.min(total,+$('#paid').value||0),debt=total-paid;if(debt&& !st.customer)return alert('Đơn ghi nợ phải chọn khách');let inv={id:Date.now(),code:code('HD',db.invoices),date:new Date().toISOString(),customerId:st.customer?.id||null,total,discount,surcharge,paid,debt,method,items:structuredClone(db.cart)};db.invoices.unshift(inv);db.cart.forEach(c=>{let p=prod(c.productId);p.stock-=c.qty;c.imeis.forEach(id=>{let i=imei(id);i.status='Đã bán';i.customerId=inv.customerId;i.invoiceId=inv.id;i.soldDate=inv.date;i.warrantyEnd=new Date(new Date(inv.date).setMonth(new Date(inv.date).getMonth()+p.warranty)).toISOString()})});if(st.customer){st.customer.total+=total;st.customer.debt+=debt;st.customer.status='Đã mua hàng'}db.cart=[];save();st.modal={type:'success',inv};render()};function crm(){let list=db.customers.filter(c=>c.status!=='Đã mua hàng');return layout(`${top('CRM','Care khách chưa mua')}<div class="content"><div class="tabs"><button class="on">Khách đang care</button><button onclick="crmToday()">Hôm nay</button><button onclick="crmOverdue()">Quá hạn</button></div><button class="btn o block" onclick="newLead()">＋ Thêm khách CRM</button><div class="section">Danh sách</div><div class="list">${list.map(c=>crmCard(c)).join('')||'<div class="card">Chưa có khách CRM</div>'}</div></div>`)}function crmCard(c){return `<div class="crmcard" onclick="crmDetail(${c.id})"><div class="row"><b>${c.name}</b><span class="crmstatus">${c.status}</span></div><div class="muted">${c.phone}</div><div style="margin-top:7px"><b>Nhu cầu:</b> ${c.need||'Chưa ghi'}</div><div class="muted">Care tiếp: ${c.nextCare?new Date(c.nextCare).toLocaleString('vi-VN'):'Chưa đặt'}</div></div>`}function newLead(){st.modal={type:'lead',c:{name:'',phone:'',status:'Khách mới',need:'',nextCare:'',history:[],total:0,debt:0}};render()}function crmDetail(id){st.modal={type:'crmdetail',c:cust(id)};render()}window.saveLead=()=>{let c=st.modal.c;c.name=$('#ln').value;c.phone=$('#lp').value;c.status=$('#ls').value;c.need=$('#need').value;c.nextCare=$('#next').value;if(!c.id){c.id=Date.now();db.customers.unshift(c)}save();st.modal=null;render()};window.addCare=id=>{st.modal={type:'care',c:cust(id)};render()};window.saveCare=()=>{let c=st.modal.c,n=$('#cnote').value,s=$('#cstatus').value,next=$('#cnext').value;c.history=c.history||[];c.history.unshift({date:new Date().toISOString(),note:n,status:s});c.status=s;c.nextCare=next;save();st.modal={type:'crmdetail',c};render()};function warranty(){return layout(`${top('Bảo hành','Tra nhanh bằng IMEI / Serial')}<div class="content"><div class="search"><input id="wq" placeholder="Nhập IMEI / Serial"><button class="btn o" onclick="lookupWarranty()">Tra</button></div><button class="btn o block" onclick="newWarranty()">＋ Tiếp nhận bảo hành</button><div class="section">Phiếu bảo hành</div><div class="list">${db.warranties.map(w=>`<div class="item" onclick="wDetail(${w.id})"><div class="thumb">🛡️</div><div class="main"><div class="name">${w.code}</div><div class="muted">${w.imei} • ${w.customerName}</div></div><span class="badge">${w.status}</span></div>`).join('')||'<div class="card">Chưa có phiếu</div>'}</div></div>`)}function lookupWarranty(){let v=$('#wq').value.trim(),i=db.imeis.find(x=>x.value===v);if(!i)return alert('Không tìm thấy IMEI');newWarranty(v)}function newWarranty(v=''){let i=db.imeis.find(x=>x.value===v),p=i?prod(i.productId):null,c=i?cust(i.customerId):null;st.modal={type:'wform',d:{imei:v,productName:p?.name||'',customerName:c?.name||'',phone:c?.phone||'',issue:'',status:'Mới tiếp nhận'}};render()}window.saveWarranty=()=>{let d=st.modal.d;d.imei=$('#wi').value;d.customerName=$('#wc').value;d.phone=$('#wp').value;d.issue=$('#we').value;d.status=$('#ws').value;let w={...d,id:Date.now(),code:code('BH',db.warranties),date:new Date().toISOString()};db.warranties.unshift(w);let i=db.imeis.find(x=>x.value===w.imei);if(i)i.status='Bảo hành';save();st.modal=null;render()};function wDetail(id){st.modal={type:'wdetail',w:db.warranties.find(x=>x.id===id)};render()}function more(){let items=[['📦','Sản phẩm','products'],['🔢','IMEI / Serial','imeilist'],['🖨️','Mẫu in K80 / A4','prints'],['🧾','Hóa đơn','invoices'],['💰','Công nợ','debts']];return layout(`${top('Thêm','Danh mục quản lý')}<div class="content"><div class="list">${items.map(x=>`<button class="card row" style="text-align:left;border:0" onclick="openMore('${x[2]}')"><b>${x[0]} ${x[1]}</b><span>›</span></button>`).join('')}</div></div>`)}window.openMore=x=>{if(x==='prints')st.modal={type:'prints',doc:'sale'};else if(x==='products')st.modal={type:'products'};else if(x==='imeilist')st.modal={type:'imeilist'};else if(x==='invoices')st.modal={type:'invoices'};else st.modal={type:'debts'};render()};function openStock(){st.modal={type:'stock',items:[],scanned:[]};render()}window.stockScan=()=>{let v=$('#stockcode').value.trim(),p=db.products.find(x=>x.barcode===v||x.sku===v);if(!p)return alert('Không tìm thấy sản phẩm');let m=st.modal,it=m.items.find(x=>x.productId===p.id);if(it)it.qty++;else m.items.push({productId:p.id,qty:1,imeis:[]});m.scanned.unshift({code:v,name:p.name,status:'✓ Hoàn thành'});$('#stockcode').value='';render()};window.finishStock=()=>{for(let it of st.modal.items){let p=prod(it.productId);p.stock+=it.qty}save();st.modal=null;render()};function scanProduct(){let v=prompt('Nhập / quét barcode');if(!v)return;let p=db.products.find(x=>x.barcode===v||x.sku===v);if(p)addCart(p.id);else alert('Không tìm thấy sản phẩm')}function salePrint(inv,paper){let c=inv.customerId?cust(inv.customerId):null,items=inv.items.map(it=>{let p=prod(it.productId);return {name:p.name,qty:it.qty,price:p.price,imeis:it.imeis.map(id=>imei(id)?.value).filter(Boolean),warranty:p.warranty}}),cls=paper==='K80'?'k80':'a4';return `<div class="${cls}"><div class="printlogo">KP KPOS</div><div class="muted">CÔNG TY TNHH PHẦN MỀM KPOS<br>Hồ Chí Minh</div><div class="dash"></div><h3>HÓA ĐƠN BÁN HÀNG</h3><div class="muted">Mã: ${inv.code}<br>Ngày: ${new Date(inv.date).toLocaleString('vi-VN')}<br>Khách: ${c?.name||'Khách lẻ'}</div><div class="dash"></div><table class="ptable"><tr><th>Sản phẩm</th><th>SL</th><th>Tiền</th></tr>${items.map(x=>`<tr><td>${x.name}${x.imeis.length?`<div class="muted">IMEI: ${x.imeis.join(', ')}</div>`:''}<div class="muted">BH: ${x.warranty} tháng</div></td><td>${x.qty}</td><td>${money(x.qty*x.price)}</td></tr>`).join('')}</table><div class="dash"></div><div class="row"><b>Tổng cộng</b><b>${money(inv.total)}</b></div><div class="muted">Thanh toán: ${inv.method}<br>Công nợ: ${money(inv.debt)}</div>${paper==='A4'?'<div style="margin-top:30px" class="row"><b>Khách hàng</b><b>Người bán hàng</b></div>':''}</div>`}function warrantyPrint(w,paper){let cls=paper==='K80'?'k80':'a4';return `<div class="${cls}"><div class="printlogo">KP KPOS</div><div class="muted">CÔNG TY TNHH PHẦN MỀM KPOS<br>Hồ Chí Minh</div><div class="dash"></div><h3>PHIẾU BẢO HÀNH</h3><div class="muted">Mã: ${w.code}<br>Ngày: ${new Date(w.date).toLocaleString('vi-VN')}</div><div class="dash"></div><p><b>Khách:</b> ${w.customerName}<br><b>SĐT:</b> ${w.phone}<br><b>Sản phẩm:</b> ${w.productName}<br><b>IMEI/Serial:</b> ${w.imei}<br><b>Lỗi:</b> ${w.issue}</p><div class="dash"></div><div class="muted"><b>Điều kiện bảo hành</b><br>• Còn tem, không rơi vỡ, vào nước.<br>• Mang theo phiếu khi bảo hành.</div>${paper==='A4'?'<div style="margin-top:30px" class="row"><b>Khách hàng</b><b>KPOS Việt Nam</b></div>':''}</div>`}function modal(){let m=st.modal;if(!m)return'';let body='';if(m.type==='imei'){let c=db.cart.find(x=>x.productId===m.id);bod scanfeed">${m.scanned.map(x=>`<div class="scanrow"><span>${x.name}<br><small>${x.code}</small></span><span class="ok">${x.status}</span></div>`).join('')}</div><div class="section">Phiếu nhập</div>${m.items.map(i=>`<div class="item"><div class="main"><b>${prod(i.productId).name}</b></div><b>${i.qty}</b></div>`).join('')}<button class="btn green block" style="margin-top:12px" onclick="finishStock()">HOÀN TẤT NHẬP HÀNG</button>`}else if(m.type==='products'){body=`<div class="list">${db.products.map(p=>`<div class="item"><div class="main"><b>${p.name}</b><div class="muted">${p.sku} • Tồn ${p.stock}</div></div><b>${money(p.price)}</b></div>`).join('')}</div>`}else if(m.type==='imeilist'){body=`<div class="list">${db.imeis.map(i=>`<div class="item"><div class="main"><b>${i.value}</b><div class="muted">${prod(i.productId)?.name}</div></div><span class="badge">${i.status}</span></div>`).join('')}</div>`}else if(m.type==='invoices'){body=`<div class="list">${db.invoices.map(i=>`<div class="item" onclick="showPrint('sale',${i.id},'K80')"><div class="main"><b>${i.code}</b><div class="muted">${new Date(i.date).toLocaleString('vi-VN')}</div></div><b>${money(i.total)}</b></div>`).join('')||'Chưa có hóa đơn'}</div>`}else if(m.type==='debts'){body=`<div class="list">${db.customers.filter(c=>c.debt>0).map(c=>`<div class="item"><div class="main"><b>${c.name}</b><div class="muted">${c.phone}</div></div><b style="color:#dc2626">${money(c.debt)}</b></div>`).join('')||'Không có công nợ'}</div>`}return `<div class="sheetbg" onclick="if(event.target===this){st.modal=null;render()}"><div class="sheet"><div class="sheethead"><b>${({imei:'Chọn IMEI / Serial',customers:'Chọn khách hàng',checkout:'Thanh toán',success:'Hoàn tất đơn hàng',lead:'Khách CRM',crmdetail:'Chi tiết khách CRM',care:'Care khách',wform:'Tiếp nhận bảo hành',wdetail:'Chi tiết bảo hành',prints:'Mẫu in',print:'Xem trước mẫu in',stock:'Nhập hàng',products:'Sản phẩm',imeilist:'IMEI / Serial',invoices:'Hóa đơn',debts:'Công nợ'})[m.type]||''}</b><button class="close" onclick="st.modal=null;render()">×</button></div>${body}</div></div>`}window.showSample=(type,paper)=>{let html=type==='sale'?salePrint({id:0,code:'HD061026-001',date:new Date().toISOString(),customerId:1,total:1949000,debt:0,method:'Chuyển khoản',items:[{productId:1,qty:1,imeis:[101]},{productId:2,qty:1,imeis:[]}]},paper):warrantyPrint({code:'BH061026-001',date:new Date().toISOString(),customerName:'Nguyễn Văn A',phone:'0901 234 567',productName:'Máy POS SUNMI D2',imei:'SUNMID2-0001',issue:'Không lên nguồn'},paper);st.modal={type:'print',html};render()};window.showPrint=(type,id,paper)=>{let html;if(type==='sale')html=salePrint(db.invoices.find(x=>x.id===id),paper);else html=warrantyPrint(db.warranties.find(x=>x.id===id),paper);st.modal={type:'print',html};render()};function crmToday(){alert('Màn hình Care hôm nay dùng dữ liệu trường “Care tiếp theo”.')}function crmOverdue(){alert('Màn hình Quá hạn sẽ lọc các lịch care đã quá thời gian.')}function render(){if(!localStorage.getItem(S)){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><div class="hero">KP KPOS</div><div class="sub">Bán hàng • CRM • IMEI • Bảo hành</div><div class="field"><label>Tài khoản</label><input id="u" value="admin"></div><div class="field"><label>Mật khẩu</label><input id="p" type="password" value="123456"></div><button class="btn o block" onclick="localStorage.setItem(S,'1');render()">ĐĂNG NHẬP</button><div class="notice" style="margin-top:12px">Tài khoản test: admin / 123456</div></div></div>`;return}let fn={home,pos,crm,warranty,more}[st.screen]||home;document.getElementById('root').innerHTML=fn()+modal()}render();</script></body></html>
