<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f97316" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>KPOS • Web App & Mobile</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase/config.js"></script>
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center;background:#fffaf7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;padding:24px;text-align:center">
      <div><div style="font-size:42px;font-weight:900;color:#f97316">KP</div><b>Đang tải KPOS…</b><div style="font-size:12px;color:#6b7280;margin-top:6px">Mobile • Web App • Supabase Realtime</div></div>
    </div>
  </div>
  <input id="imagePicker" type="file" accept="image/*" multiple hidden />
  <script>
    const CORE_APP_PARTS = [
      "v6/app-00.txt","v6/app-01.txt","v6/app-02.txt",
      "v6/app-03.txt","v6/app-04.txt","v6/app-05.txt"
    ];
    const CORE_CSS_PARTS = ["v6/css-00.txt"];

    async function fetchText(path){
      const response = await fetch(path, {cache:"no-cache"});
      if(!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.text();
    }

    (async()=>{
      const css = (await Promise.all(CORE_CSS_PARTS.map(fetchText))).join("");
      const style = document.createElement("style");
      style.textContent = css;
      document.head.appendChild(style);

      const code = (await Promise.all(CORE_APP_PARTS.map(fetchText))).join("");
      const core = document.createElement("script");
      core.textContent = code;
      document.body.appendChild(core);

      const patch7Code = await fetchText("v7/patch.js");
      const patch7 = document.createElement("script");
      patch7.textContent = patch7Code;
      document.body.appendChild(patch7);

      const patch8Code = await fetchText("v8/patch.js");
      const patch8 = document.createElement("script");
      patch8.textContent = patch8Code;
      document.body.appendChild(patch8);

      const diagnosticsCode = await fetchText("v8/diagnostics.js");
      const diagnostics = document.createElement("script");
      diagnostics.textContent = diagnosticsCode;
      document.body.appendChild(diagnostics);

      const desktopCss = await fetchText("desktop/desktop.css");
      const desktopProCss = await fetchText("desktop/pro.css");
      const desktopStyle = document.createElement("style");
      desktopStyle.textContent = desktopCss + "\n" + desktopProCss;
      document.head.appendChild(desktopStyle);

      const desktopCode = await fetchText("desktop/desktop.js");
      const desktopScript = document.createElement("script");
      desktopScript.textContent = desktopCode;
      document.body.appendChild(desktopScript);

      const desktopProCode = await fetchText("desktop/pro.js");
      const desktopProScript = document.createElement("script");
      desktopProScript.textContent = desktopProCode;
      document.body.appendChild(desktopProScript);

      const desktopProFixCode = await fetchText("desktop/pro-fix.js");
      const desktopProFixScript = document.createElement("script");
      desktopProFixScript.textContent = desktopProFixCode;
      document.body.appendChild(desktopProFixScript);
    })().catch(error=>{
      console.error(error);
      document.getElementById("app").innerHTML = `
        <div style="min-height:100vh;display:grid;place-items:center;background:#fffaf7;font-family:system-ui;padding:24px">
          <div style="max-width:420px;background:#fff;border:1px solid #fed7aa;border-radius:20px;padding:20px">
            <div style="font-size:28px;font-weight:900;color:#f97316">KPOS</div>
            <h3>Không tải được ứng dụng</h3>
            <p>Vui lòng tải lại trang. Nếu vẫn lỗi, hãy kiểm tra kết nối mạng.</p>
            <div style="font-size:12px;color:#6b7280;word-break:break-word">${String(error)}</div>
            <button onclick="location.reload()" style="width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:#f97316;color:white;font-weight:800">TẢI LẠI</button>
          </div>
        </div>`;
    });
  </script>
</body>
</html>
