<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f97316" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>KPOS • Web App & Mobile</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="supabase/config.js"></script>
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center;background:#fffaf7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;padding:24px;text-align:center">
      <div><div style="font-size:42px;font-weight:900;color:#f97316">KP</div><b>Đang tải KPOS…</b><div style="font-size:12px;color:#6b7280;margin-top:6px">Mobile • Web App • Supabase Realtime</div></div>
    </div>
  </div>
  <input id="imagePicker" type="file" accept="image/*" multiple hidden />
  <script>
    const BUILD = "20261006-pos-v3-pack-1";
    const CORE_APP_PARTS = [
      "v6/app-00.txt","v6/app-01.txt","v6/app-02.txt",
      "v6/app-03.txt","v6/app-04.txt","v6/app-05.txt"
    ];
    const CORE_CSS_PARTS = ["v6/css-00.txt"];

    async function fetchText(path){
      const joiner = path.includes('?') ? '&' : '?';
      const response = await fetch(`${path}${joiner}build=${encodeURIComponent(BUILD)}`, {cache:"no-store"});
      if(!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.text();
    }
    function injectScript(code){
      const s=document.createElement("script");s.textContent=code;document.body.appendChild(s);
    }

    (async()=>{
      const css = (await Promise.all(CORE_CSS_PARTS.map(fetchText))).join("");
      const desktopCss = await fetchText("desktop/desktop.css");
      const desktopProCss = await fetchText("desktop/pro.css");
      const businessCss = await fetchText("desktop/business.css");
      const finishCss = await fetchText("desktop/finish.css");
      const returnsCss = await fetchText("desktop/returns.css");
      const loyaltyCss = await fetchText("desktop/loyalty.css");
      const foundationCss = await fetchText("desktop/foundation.css");
      const tableCss = await fetchText("desktop/table-pack.css");
      const auditCss = await fetchText("desktop/system-audit.css");
      const operationsCss = await fetchText("desktop/operations-v2.css");
      const inventoryProCss = await fetchText("desktop/inventory-pro.css");
      const dashboardV2Css = await fetchText("desktop/dashboard-v2.css");
      const posV2Css = await fetchText("desktop/pos-v2.css");
      const posV3Css = await fetchText("desktop/pos-v3.css");
      const style = document.createElement("style");
      style.textContent = css + "\n" + desktopCss + "\n" + desktopProCss + "\n" + businessCss + "\n" + finishCss + "\n" + returnsCss + "\n" + loyaltyCss + "\n" + foundationCss + "\n" + tableCss + "\n" + auditCss + "\n" + operationsCss + "\n" + inventoryProCss + "\n" + dashboardV2Css + "\n" + posV2Css + "\n" + posV3Css;
      document.head.appendChild(style);

      const code = (await Promise.all(CORE_APP_PARTS.map(fetchText))).join("");
      injectScript(code);
      injectScript(await fetchText("v7/patch.js"));

      /* Desktop/business được nạp trước V8 để mọi callback cloud dùng đúng renderer responsive. */
      injectScript(await fetchText("desktop/desktop.js"));
      injectScript(await fetchText("desktop/pro.js"));
      injectScript(await fetchText("desktop/pro-fix.js"));
      injectScript(await fetchText("desktop/sales.js"));
      injectScript(await fetchText("desktop/ops.js"));
      injectScript(await fetchText("desktop/finish.js"));
      injectScript(await fetchText("desktop/returns.js"));
      injectScript(await fetchText("desktop/loyalty.js"));
      injectScript(await fetchText("desktop/foundation.js"));
      injectScript(await fetchText("desktop/table-pack.js"));

      injectScript(await fetchText("v8/patch.js"));
      injectScript(await fetchText("v8/diagnostics.js"));
      /* Nạp các lớp nghiệp vụ cuối để giữ renderer, bộ lọc và kho nâng cao mới nhất. */
      injectScript(await fetchText("desktop/system-audit.js"));
      injectScript(await fetchText("desktop/operations-v2.js"));
      injectScript(await fetchText("desktop/inventory-pro.js"));
      injectScript(await fetchText("desktop/final-audit.js"));
      /* Chốt từng màn hình: Tổng quan trước, POS sau. */
      injectScript(await fetchText("desktop/dashboard-v2.js"));
      injectScript(await fetchText("desktop/pos-v2.js"));
      injectScript(await fetchText("desktop/pos-v3.js"));
      render();
    })().catch(error=>{
      console.error(error);
      document.getElementById("app").innerHTML = `
        <div style="min-height:100vh;display:grid;place-items:center;background:#fffaf7;font-family:system-ui;padding:24px">
          <div style="max-width:420px;background:#fff;border:1px solid #fed7aa;border-radius:20px;padding:20px">
            <div style="font-size:28px;font-weight:900;color:#f97316">KPOS</div>
            <h3>Không tải được ứng dụng</h3>
            <p>Vui lòng tải lại trang. Nếu vẫn lỗi, hãy kiểm tra kết nối mạng.</p>
            <div style="font-size:12px;color:#6b7280;word-break:break-word">${String(error)}</div>
            <button onclick="location.reload()" style="width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:#f97316;color:white;font-weight:800">TẢI LẠI</button>
          </div>
        </div>`;
    });
  </script>
</body>
</html>
