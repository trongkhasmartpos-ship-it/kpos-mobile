<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f97316" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>KPOS Mobile V7</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center;background:#fffaf7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;padding:24px;text-align:center">
      <div><div style="font-size:42px;font-weight:900;color:#f97316">KP</div><b>Đang tải KPOS Mobile V7…</b></div>
    </div>
  </div>
  <input id="imagePicker" type="file" accept="image/*" multiple hidden />
  <script>
    const CORE_APP_PARTS = [
      "v6/app-00.txt","v6/app-01.txt","v6/app-02.txt",
      "v6/app-03.txt","v6/app-04.txt","v6/app-05.txt"
    ];
    const CORE_CSS_PARTS = ["v6/css-00.txt"];

    async function fetchText(path){
      const response = await fetch(path, {cache:"no-cache"});
      if(!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.text();
    }

    (async()=>{
      const css = (await Promise.all(CORE_CSS_PARTS.map(fetchText))).join("");
      const style = document.createElement("style");
      style.textContent = css;
      document.head.appendChild(style);

      const code = (await Promise.all(CORE_APP_PARTS.map(fetchText))).join("");
      const core = document.createElement("script");
      core.textContent = code;
      document.body.appendChild(core);

      const patchCode = await fetchText("v7/patch.js");
      const patch = document.createElement("script");
      patch.textContent = patchCode;
      document.body.appendChild(patch);
    })().catch(error=>{
      console.error(error);
      document.getElementById("app").innerHTML = `
        <div style="min-height:100vh;display:grid;place-items:center;background:#fffaf7;font-family:system-ui;padding:24px">
          <div style="max-width:420px;background:#fff;border:1px solid #fed7aa;border-radius:20px;padding:20px">
            <div style="font-size:28px;font-weight:900;color:#f97316">KPOS</div>
            <h3>Không tải được ứng dụng</h3>
            <p>Vui lòng tải lại trang. Nếu vẫn lỗi, hãy kiểm tra kết nối mạng.</p>
            <div style="font-size:12px;color:#6b7280;word-break:break-word">${String(error)}</div>
            <button onclick="location.reload()" style="width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:#f97316;color:white;font-weight:800">TẢI LẠI</button>
          </div>
        </div>`;
    });
  </script>
</body>
</html>
