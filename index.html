<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#f97316"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>KPOS Mobile V5 Full</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icons/icon.svg"/>
</head>
<body>
<div id="app"><div style="font-family:system-ui;padding:32px;text-align:center">Đang tải KPOS…</div></div>
<input id="imagePicker" type="file" accept="image/*" multiple hidden/>
<script>
const APP_PARTS=["appb-00.txt", "appb-01.txt", "appb-02.txt", "appb-03.txt", "appb-04.txt", "appb-05.txt", "appb-06.txt", "appb-07.txt", "appb-08.txt", "appb-09.txt", "appb-10.txt", "appb-11.txt", "appb-12.txt", "appb-13.txt", "appb-14.txt", "appb-15.txt"];
const CSS_PARTS=["cssb-00.txt", "cssb-01.txt", "cssb-02.txt"];
function decode64(parts){const b=atob(parts.join(''));const u=Uint8Array.from(b,c=>c.charCodeAt(0));return new TextDecoder().decode(u)}
(async()=>{
 const css=decode64(await Promise.all(CSS_PARTS.map(x=>fetch(x).then(r=>r.text()))));
 const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);
 const code=decode64(await Promise.all(APP_PARTS.map(x=>fetch(x).then(r=>r.text()))));
 const script=document.createElement('script');script.textContent=code;document.body.appendChild(script);
})().catch(e=>{document.getElementById('app').innerHTML='<div style="padding:24px;font-family:system-ui"><b>Không tải được KPOS.</b><br>'+e+'</div>'});
</script>
</body>
</html>
